name: Deploy to GitHub Pages

# This repository is public, so Pages is available on the free plan and Actions
# minutes are unmetered here — the type-check gate below costs nothing to run.
on:
  push:
    branches: [main]
  # Allows a manual re-deploy from the Actions tab without a new commit.
  workflow_dispatch:

# `pages: write` publishes the artifact; `id-token: write` lets deploy-pages
# authenticate over OIDC. Without both, the deploy step is denied.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run supersede a queued one, but never cancel a deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate the deploy on types. A public repo means unmetered minutes, so this
      # is a cheap way to stop a broken build from ever reaching the live site.
      - name: Type-check
        run: npm run check

      - name: Build
        env:
          # A project site is served from /<repo>/, so the base path is the repo
          # name. Deriving it here means renaming the repo needs no code change.
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Must match the `pages` output dir used by adapter-static.
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
